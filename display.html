<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Commentary</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #0c0e12; color: #e8e6e0;
    font-family: Georgia, "Iowan Old Style", serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  #status {
    position: fixed; top: 1rem; right: 1.4rem;
    font: 0.8rem/1 system-ui, sans-serif; color: #4a5262; letter-spacing: 0.08em;
    text-transform: uppercase; z-index: 2;
  }
  #status.live { color: #6faf7a; }
  #status.thinking { color: #c9a45a; }
  #status.crashed { color: #c05a5a; }
  @keyframes pulse {
    0%   { text-shadow: 0 0 0 rgba(232,230,224,0); }
    25%  { text-shadow: 0 0 34px rgba(232,230,224,0.55); }
    100% { text-shadow: 0 0 0 rgba(232,230,224,0); }
  }
  #current.pulse { animation: pulse 2.2s ease-out 1; }
  #top { flex: 1; display: flex; min-height: 0; }
  #videobox {
    flex: 1.1; display: flex; flex-direction: column; justify-content: center;
    padding: 3vh 0 3vh 3vw; position: relative;
  }
  #videobox[hidden] { display: none; }
  #player { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #1c2028; }
  #starthint {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font: 1rem system-ui, sans-serif; color: #8a92a2;
    background: rgba(12,14,18,0.6); cursor: pointer;
  }
  #main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 4vh 6vw; min-height: 0;
  }
  #current {
    font-size: clamp(1.6rem, 4.2vw, 3.4rem); line-height: 1.35;
    font-style: italic; opacity: 0; transition: opacity 1.2s ease;
  }
  #current.shown { opacity: 1; }
  #current .quote, #feed .quote {
    display: block; font-size: 55%; font-style: normal; color: #8a92a2;
    border-left: 2px solid #2c3240; padding-left: 0.8em; margin-bottom: 0.6em;
    line-height: 1.4;
  }
  #feed .quote { font-size: 85%; }
  #current .ts {
    display: block; margin-top: 1.2rem;
    font: 0.85rem/1 system-ui, sans-serif; font-style: normal; color: #4a5262;
  }
  #ticker {
    border-top: 1px solid #1c2028; padding: 0.9rem 2vw 1.1rem;
    font: clamp(0.75rem, 1.3vw, 1rem)/1.4 system-ui, sans-serif;
    color: #3d4452; white-space: nowrap; overflow: hidden; text-align: right;
  }
  /* --- grading (on ?ops or ?grade) --- */
  .gradebtns { display: inline-flex; gap: 0.5em; margin-left: 0.8em;
               font-style: normal; vertical-align: middle; }
  .gradebtns button {
    background: #161a22; border: 1px solid #2c3240; color: #8a92a2;
    border-radius: 6px; font-size: 0.95rem; padding: 0.15em 0.5em; cursor: pointer;
  }
  .gradebtns button.picked { border-color: #6faf7a; color: #e8e6e0; }
  .gradebtns button:disabled { cursor: default; opacity: 0.7; }
  .gradenote {
    background: #161a22; border: 1px solid #2c3240; color: #e8e6e0;
    border-radius: 6px; font: 0.78rem system-ui, sans-serif;
    padding: 0.25em 0.6em; margin-left: 0.5em; width: 200px; max-width: 45vw;
  }
  .gradenote::placeholder { color: #4a5262; }
  .tally { font-size: 0.7rem; color: #6faf7a; margin-left: 0.25em; }
  .noted { color: #6faf7a; font: 0.75rem system-ui, sans-serif;
           font-style: normal; margin-left: 0.5em; }
  /* --- operator pane (?ops) --- */
  #ops {
    position: fixed; top: 0; right: 0; bottom: 0; width: 330px; z-index: 1;
    background: rgba(12,14,18,0.92); border-left: 1px solid #1c2028;
    padding: 2.6rem 1.1rem 1rem; overflow-y: auto;
    font: 0.8rem/1.5 ui-monospace, "JetBrains Mono", monospace; color: #8a92a2;
  }
  #ops[hidden] { display: none; }
  body.ops #top, body.ops #ticker { margin-right: 330px; }
  #ops .h { color: #4a5262; text-transform: uppercase; letter-spacing: 0.08em;
            font-size: 0.7rem; margin: 1.1rem 0 0.3rem; }
  #ops .h:first-child { margin-top: 0; }
  #ops-chat button {
    background: #161a22; border: 1px solid #2c3240; color: #8a92a2;
    border-radius: 6px; font: inherit; padding: 0.2em 0.7em; cursor: pointer;
    margin-right: 0.4em;
  }
  #ops-chat button.picked { border-color: #c9a45a; color: #e8e6e0; }
  #ops-passes div { margin-bottom: 0.35rem; }
  #ops-passes .t { color: #4a5262; }
  /* --- live transcript feed with send-to-Claude notches --- */
  #feed {
    flex: 0 0 26vw; min-width: 260px; border-left: 1px solid #1c2028;
    padding: 2.6rem 1rem 1rem; overflow-y: auto;
    font: 0.82rem/1.45 system-ui, sans-serif; color: #8a92a2;
  }
  #feed[hidden] { display: none; }
  #feed .msg { margin-bottom: 0.55rem; }
  #feed .who { font-weight: 600; color: #a8b0c0; }
  #feed .who.audience { color: #c9a45a; }
  #feed .t { color: #3d4452; font-size: 0.7rem; margin-left: 0.4em; }
  #feed .notch {
    display: flex; align-items: center; gap: 0.6em; margin: 0.7rem 0;
    color: #6faf7a; font-size: 0.72rem; letter-spacing: 0.05em;
    text-transform: uppercase; white-space: nowrap;
  }
  #feed .notch::before, #feed .notch::after {
    content: ""; flex: 1; border-top: 1px dashed #2c3240;
  }
  #feed .notch.pass { color: #4a5262; white-space: normal; text-transform: none; }
  #feed .notch.commented { color: #e8e6e0; }
  #feed .notch.search { color: #c9a45a; white-space: normal; text-transform: none; }
  #feed .msg.muse {
    border-left: 2px solid #6faf7a; padding-left: 0.7em; margin: 0.7rem 0;
    font-family: Georgia, "Iowan Old Style", serif; font-size: 0.95rem;
    font-style: italic; color: #e8e6e0;
  }
  #feed .msg.muse .who { font: 600 0.72rem system-ui, sans-serif;
    font-style: normal; color: #6faf7a; letter-spacing: 0.06em; display: block; }
  #feed .msg.muse.ask { border-left-color: #c9a45a; }
  #feed .msg.muse.ask .who { color: #c9a45a; }
  body.feed #ticker { display: none; }  /* the feed supersedes the ticker */
  /* --- QR corner: phones in the room scan to follow along --- */
  #qr {
    position: fixed; left: 1.2rem; bottom: 3.4rem; z-index: 1;
    text-align: center; font: 0.65rem/1.5 system-ui, sans-serif; color: #4a5262;
  }
  #qr img { width: 96px; height: 96px; background: #fff; padding: 5px;
            border-radius: 4px; display: block; margin: 0 auto 0.25rem; }
  #qr[hidden] { display: none; }
  /* --- phone layout: scrollable feed instead of a fixed projection --- */
  @media (max-width: 700px) {
    body { height: auto; min-height: 100dvh; overflow-y: auto; }
    #top { flex-direction: column; flex: none; }
    #videobox, #qr { display: none; }
    #main { padding: 4.5rem 7vw 2rem; justify-content: flex-start; flex: none; }
    #current { font-size: 1.5rem; }
    #feed { flex: none; min-width: 0; border-left: none; overflow: visible;
            border-top: 1px solid #1c2028; padding: 1rem 6vw 4rem; }
    #ticker { position: fixed; bottom: 0; left: 0; right: 0;
              background: #0c0e12; text-align: left; }
    #ops { position: static; width: auto; border-left: none;
           border-top: 1px solid #1c2028; padding-top: 1rem; }
    body.ops #top, body.ops #ticker { margin-right: 0; }
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="top">
    <div id="videobox" hidden>
      <div id="player"></div>
      <div id="starthint">click to start the video in sync with the feed</div>
    </div>
    <div id="main"><div id="current"></div></div>
    <div id="feed" hidden></div>
  </div>
  <div id="ticker"></div>
  <div id="qr" hidden><img src="/qr.svg" alt=""><span id="qr-url"></span></div>
  <div id="ops" hidden>
    <div class="h">pipeline</div>
    <div id="ops-stage">stage: connecting…</div>
    <div id="ops-tick">—</div>
    <div class="h">chattiness</div>
    <div id="ops-chat">
      <button data-level="strict">strict</button><button data-level="chatty">chatty</button><button data-level="eager">eager</button>
    </div>
    <div class="h">recent passes</div>
    <div id="ops-passes"></div>
  </div>
<script>
  const current = document.getElementById("current");
  const ticker  = document.getElementById("ticker");
  const status  = document.getElementById("status");
  const params  = new URLSearchParams(location.search);
  const opsOn   = params.has("ops");
  const gradeOn = opsOn || params.has("grade");
  let tickerText = "";
  let crashed = false;
  let lastComment = null;   // {id, text} currently on the big display

  if (opsOn) {
    document.getElementById("ops").hidden = false;
    document.body.classList.add("ops");
  }

  function setStatus(text) {
    status.textContent = text;
    crashed = text.includes("crashed");
    status.classList.toggle("crashed", crashed);
    status.classList.toggle("thinking", !crashed && text.startsWith("thinking"));
    status.classList.toggle("live", !crashed && !text.startsWith("thinking"));
    const opsStage = document.getElementById("ops-stage");
    if (opsStage) opsStage.textContent = "stage: " + text;
  }

  // KaTeX auto-render; harmless no-op while the CDN script hasn't loaded
  function katexify(el) {
    if (typeof renderMathInElement === "undefined") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true },
      ],
      throwOnError: false,
    });
  }

  // split an optional leading "> quote" line off the comment body
  function splitComment(text) {
    const lines = text.split("\n");
    const quote = lines.filter(l => l.startsWith("> ")).map(l => l.slice(2)).join(" ");
    const body  = lines.filter(l => !l.startsWith("> ")).join(" ").trim();
    return { quote, body };
  }

  function gradeButtons(id, counts) {
    const span = document.createElement("span");
    span.className = "gradebtns";
    [["👍", "up"], ["👎", "down"]].forEach(([face, grade]) => {
      const b = document.createElement("button");
      b.textContent = face;
      const n = document.createElement("span");
      n.className = "tally"; n.dataset.id = id; n.dataset.g = grade;
      n.textContent = counts && counts[grade] ? counts[grade] : "";
      b.append(n);
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        fetch("/grade", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, grade }) });
        span.querySelectorAll("button").forEach(x => { x.disabled = true; });
        b.classList.add("picked");
        // optional private note — goes into Marginalia's prompt, never on screen
        const input = document.createElement("input");
        input.className = "gradenote";
        input.placeholder = "why? (only Marginalia sees this)";
        input.maxLength = 300;
        input.addEventListener("keydown", (k) => {
          if (k.key !== "Enter" || !input.value.trim()) return;
          fetch("/grade_note", { method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, grade, note: input.value.trim() }) });
          const ok = document.createElement("span");
          ok.className = "noted"; ok.textContent = "noted ✓";
          input.replaceWith(ok);
        });
        span.append(input);
        input.focus();
      });
      span.append(b);
    });
    return span;
  }

  // stable color per anonymous speaker letter
  function whoColor(w) {
    let h = 0;
    for (const ch of w) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h}, 45%, 65%)`;
  }

  function renderInto(el, comment, withTs) {
    el.innerHTML = "";
    const { quote, body } = splitComment(comment.text);
    if (quote) {
      const q = document.createElement("span");
      q.className = "quote"; q.textContent = "“" + quote + "”";
      el.append(q);
    }
    el.append(document.createTextNode(
      (comment.kind === "ask" ? "❓ " : "") + body));
    if (gradeOn && comment.id != null)
      el.append(gradeButtons(comment.id, { up: comment.up, down: comment.down }));
    if (withTs && comment.ts) {
      const ts = document.createElement("span");
      ts.className = "ts"; ts.textContent = comment.ts;
      el.append(ts);
    }
    katexify(el);
  }

  // --- live transcript feed (right side) with send-to-Claude notches ---
  const feed = document.getElementById("feed");
  const feedOn = !params.has("nofeed");
  if (feedOn) { feed.hidden = false; document.body.classList.add("feed"); }
  let pendingNotch = null;   // the notch for the Claude call in flight

  function feedAppend(el) {
    const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    feed.append(el);
    while (feed.childElementCount > 120) feed.firstChild.remove();
    if (stick) feed.scrollTop = feed.scrollHeight;
  }

  let feedLastWho = null;   // merge consecutive same-speaker lines visually

  function feedMessage(ev) {
    const d = document.createElement("div");
    d.className = "msg";
    const m = ev.text.match(/^([A-Z]+\d*(?:-\d+)?): (.*)$/s);
    if (m) {
      if (m[1] !== feedLastWho) {
        const who = document.createElement("span");
        who.className = "who";
        who.style.color = whoColor(m[1]);
        who.textContent = m[1] + " ";
        d.append(who);
      }
      d.append(document.createTextNode(m[2]));
      feedLastWho = m[1];
    } else {
      d.append(document.createTextNode(ev.text));
      feedLastWho = null;
    }
    if (ev.ts) {
      const t = document.createElement("span");
      t.className = "t"; t.textContent = ev.ts;
      d.append(t);
    }
    katexify(d);
    feedAppend(d);
  }

  // Marginalia's comments are backfilled into the chat at their notch position,
  // so the feed is the full conversation history
  function feedComment(c) {
    const d = document.createElement("div");
    d.className = "msg muse" + (c.kind === "ask" ? " ask" : "");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = "MARGINALIA" + (c.ts ? " · " + c.ts : "");
    const body = document.createElement("div");
    renderInto(body, c, false);
    d.append(who, body);
    feedLastWho = null;
    feedAppend(d);
  }

  function feedNotch(ts) {
    const d = document.createElement("div");
    d.className = "notch";
    d.textContent = `sent to claude ${ts} · thinking…`;
    pendingNotch = { el: d, ts };
    feedLastWho = null;   // a notch breaks the speaker run
    feedAppend(d);
  }

  function resolveNotch(cls, label) {
    if (!pendingNotch) return;
    pendingNotch.el.classList.add(cls);
    pendingNotch.el.textContent = `sent to claude ${pendingNotch.ts} · ${label}`;
    pendingNotch = null;
  }

  const es = new EventSource("/events");
  es.onopen  = () => setStatus("live");
  es.onerror = () => { if (!crashed) setStatus("reconnecting…"); };

  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "transcript") {
      tickerText = (tickerText + " " + ev.text).slice(-300);
      ticker.textContent = tickerText;
      if (feedOn) feedMessage(ev);
    } else if (ev.type === "comment") {          // full comment (replay for late joiners)
      lastComment = { id: ev.id, text: ev.text };
      renderInto(current, ev, true);
      current.classList.add("shown");
      if (feedOn) feedComment(ev);
    } else if (ev.type === "comment_start" || ev.type === "comment_delta") {
      if (ev.type === "comment_start") resolveNotch("commented", "commented ↓");
      if (!lastComment || lastComment.id !== ev.id) {   // new comment beginning
        lastComment = { id: ev.id, text: "", ts: ev.ts || "" };
        current.classList.remove("pulse");
        current.classList.add("shown");
      }
      if (ev.type === "comment_delta") {
        lastComment.text = ev.text;
        renderInto(current, { id: null, text: ev.text }, false);
      }
    } else if (ev.type === "comment_done") {
      lastComment = { id: ev.id, text: ev.text };
      renderInto(current, ev, true);
      current.classList.add("shown");
      current.classList.remove("pulse");
      void current.offsetWidth;  // restart the animation
      current.classList.add("pulse");
      if (feedOn) feedComment(ev);
      if (ev.ts) chime();
    } else if (ev.type === "status") {
      setStatus(ev.text);
    } else if (ev.type === "stage") {
      if (!crashed) setStatus(ev.text === "listening" ? "live" : ev.text);
      if (feedOn && ev.text === "thinking…") feedNotch(ev.ts || "");
    } else if (ev.type === "tick" && opsOn) {
      const wordsOk = ev.new_words >= ev.need_words ? "✓" : "✗";
      document.getElementById("ops-tick").textContent =
        `${ev.new_words}/${ev.need_words} new words ${wordsOk} · ` +
        (ev.wait > 0 ? `next call in ≥${ev.wait}s` : "call ready");
    } else if (ev.type === "pass") {
      resolveNotch("pass", "pass · " + (ev.text || "no reason").slice(0, 70));
      if (opsOn) {
        const d = document.createElement("div");
        d.innerHTML = `<span class="t">${ev.ts} (${ev.dt}s)</span> `;
        d.append(document.createTextNode(ev.text || "(no reason given)"));
        const passes = document.getElementById("ops-passes");
        passes.prepend(d);
        while (passes.childElementCount > 10) passes.lastChild.remove();
      }
    } else if (ev.type === "search_spawn") {
      resolveNotch("search", "🔎 search agent · " + ev.text.slice(0, 70));
    } else if (ev.type === "search_done") {
      if (opsOn) {
        const d = document.createElement("div");
        d.innerHTML = `<span class="t">${ev.ts} (${ev.dt}s)</span> 🔎 `;
        d.append(document.createTextNode(ev.query));
        const passes = document.getElementById("ops-passes");
        passes.prepend(d);
        while (passes.childElementCount > 10) passes.lastChild.remove();
      }
    } else if (ev.type === "grade") {
      document.querySelectorAll(`.tally[data-id="${ev.id}"]`).forEach(t => {
        const n = ev[t.dataset.g];
        t.textContent = n ? n : "";
      });
    } else if (ev.type === "config") {
      markChattiness(ev.chattiness);
    }
  };

  // chattiness controls (ops pane) — live retuning via POST /config
  function markChattiness(level) {
    document.querySelectorAll("#ops-chat button").forEach(b =>
      b.classList.toggle("picked", b.dataset.level === level));
  }
  if (opsOn) {
    fetch("/config").then(r => r.json()).then(c => markChattiness(c.chattiness));
    document.querySelectorAll("#ops-chat button").forEach(b =>
      b.addEventListener("click", () =>
        fetch("/config", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chattiness: b.dataset.level }) })));

  }

  // Opt-in chime: open the page as /?chime (browsers require a click first
  // to unlock audio, so click anywhere on the page once after loading).
  const chimeOn = params.has("chime");
  let audioCtx = null;
  document.addEventListener("click", () => {
    if (chimeOn && !audioCtx) audioCtx = new AudioContext();
  }, { once: true });
  // Video pane: in YouTube mode, embed the video seeked to wherever the
  // audio feed currently is, playing at the same speed. YouTube caps
  // playbackRate at 2x; above that the periodic resync jump-cuts forward.
  fetch("/meta").then(r => r.json()).then(meta => {
    if (meta.url && !params.has("noqr")) {
      document.getElementById("qr-url").textContent = meta.url.replace("http://", "");
      document.getElementById("qr").hidden = false;
      document.body.classList.add("qr");
    }
    if (!meta.youtube_id) return;
    document.getElementById("videobox").hidden = false;
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.append(tag);
    window.onYouTubeIframeAPIReady = () => {
      const player = new YT.Player("player", {
        videoId: meta.youtube_id,
        playerVars: { controls: 1, rel: 0 },
        events: {
          onReady: () => {
            const feedPos = () => (Date.now() / 1000 - meta.started_at) * meta.speed;
            const sync = () => {
              player.setPlaybackRate(meta.speed);
              if (Math.abs(player.getCurrentTime() - feedPos()) > 2.5)
                player.seekTo(feedPos(), true);
            };
            const hint = document.getElementById("starthint");
            hint.addEventListener("click", () => {
              hint.remove();
              sync(); player.playVideo();
              setInterval(sync, 10000);
            }, { once: true });
          },
        },
      });
    };
  });

  function chime() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [523.25, 783.99].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t + i * 0.12);
      gain.gain.linearRampToValueAtTime(0.08, t + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.7);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.8);
    });
  }
</script>
</body>
</html>
