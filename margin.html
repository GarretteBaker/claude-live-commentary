<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Patrick+Hand&family=Nanum+Pen+Script&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e4;
    --paper-edge: #ece4d0;
    --body-ink: #8a8172;      /* deliberately faint: the transcript is scaffolding */
    --label-ink: #a89c86;
    --note-ink: #26437c;      /* ballpoint blue-black */
    --note-ink-soft: rgba(38, 67, 124, 0.55);
    --pencil: #9a917f;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--body-ink);
    font-family: Georgia, "Iowan Old Style", serif;
    background-image: linear-gradient(90deg, var(--paper-edge) 0, var(--paper) 26px);
  }
  #status {
    position: fixed; top: 0.9rem; right: 1.2rem; z-index: 3;
    font: 0.72rem/1 system-ui, sans-serif; color: #b8ad97;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #status.live { color: #7d9a6e; }
  #status.thinking { color: #b08d4f; }
  #status.crashed { color: #b45a5a; }

  #book {
    position: relative; max-width: 1360px; margin: 0 auto;
    padding: 4.5rem 0 40vh;   /* bottom slack so the newest line sits mid-screen */
  }
  #text {
    width: 56%; margin-left: 5%;
    font-size: clamp(15px, 1.25vw, 19px); line-height: 1.75;
    text-align: justify; hyphens: auto;
    transition: opacity 0.5s ease;
  }
  body.ghost #text { opacity: 0.06; }
  #text .para { margin-bottom: 0.9em; }
  #text .label {
    font: 600 0.68em system-ui, sans-serif; letter-spacing: 0.12em;
    color: var(--label-ink); margin-right: 0.7em;
  }
  /* provisional (lowercase, unrevised) lines sit lighter on the page until
     the revision lane replaces them with settled text */
  #text .prov { opacity: 0.55; }
  #text .pausemark {
    text-align: center; color: #c4bba8; font-size: 0.8em;
    letter-spacing: 0.3em; margin: 0.4em 0;
  }
  /* anchor words: the phrase a margin note points at */
  #text .w.anch {
    color: #4a4336;
    text-decoration: underline; text-decoration-color: var(--note-ink-soft);
    text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  #text .w.anch.hot {
    background: rgba(38, 67, 124, 0.10); color: #26324a;
  }

  #notes { position: absolute; top: 0; left: 0; right: 0; }
  .note {
    position: absolute; left: 64%; width: 32%;
    font-family: var(--note-font, "KaTeX_Main"), Georgia, serif;
    font-size: calc(clamp(22px, 2.0vw, 32px) * var(--note-scale, 1));
    font-weight: var(--note-weight, 400); font-style: var(--note-style, italic);
    line-height: 1.18;
    color: var(--note-ink);
    transform: rotate(-0.6deg);
    transition: top 0.45s ease;
    padding-left: 0.9rem;
  }
  .note:nth-child(even) { transform: rotate(0.45deg); }
  .note .lead {
    display: block; font-size: 62%; font-weight: 500;
    color: var(--note-ink-soft); margin-bottom: 0.1em;
  }
  .note .w { display: inline-block; opacity: 0; margin-right: 0.26em; }
  .note .w.ink { animation: ink 0.30s ease-out forwards; }
  .note .w.now { opacity: 1; }             /* replayed notes: no re-drawing */
  @keyframes ink {
    from { opacity: 1; clip-path: inset(0 100% -12% 0); }
    to   { opacity: 1; clip-path: inset(0 -8% -12% 0); }
  }
  .note .pen { opacity: 0.8; font-size: 70%; }
  .note .katex { font-size: 0.82em; }      /* KaTeX next to cursive runs large */
  .note.scribble {
    color: var(--pencil); font-weight: 500; font-size: clamp(17px, 1.4vw, 22px);
  }
  /* a question to the room: red pencil, leading ? */
  .note.ask { color: #a03d2e; }
  .note.ask::before { content: "?  "; font-weight: 700; }
  /* reader marginalia: same hand as Marginalia, graphite and smaller */
  .note.reader { color: #6b6458; }
  /* endnote threads announce themselves as bookmarks poking out of the
     book's right edge at their note's height */
  .bookmark {
    position: absolute; right: 0; z-index: 4; cursor: pointer;
    background: var(--ribbon, #8e3b2f); color: #f6f1e4;
    font: 600 0.72rem system-ui, sans-serif; letter-spacing: 0.06em;
    padding: 0.4em 1em 0.4em 1.3em; white-space: nowrap;
    clip-path: polygon(15px 0, 100% 0, 100% 100%, 15px 100%, 0 50%);
    box-shadow: 0 2px 7px rgba(60,50,30,0.3); opacity: 0.87;
    transition: top 0.45s ease, transform 0.2s ease, opacity 0.2s ease;
  }
  .bookmark:hover { opacity: 1; transform: translateX(-6px); }
  .bookmark.active { opacity: 1; transform: translateX(-12px); }
  .bookmark .bcount {
    background: rgba(255,255,255,0.28); border-radius: 9px;
    padding: 0 0.5em; margin-left: 0.55em; font-size: 0.66rem;
  }
  .note .replybtn {
    opacity: 0; cursor: pointer; border: none; background: none;
    color: var(--pencil); font: 0.9rem system-ui, sans-serif; margin-left: 0.4em;
    transition: opacity 0.2s;
  }
  .note:hover .replybtn { opacity: 0.8; }
  .replyinput {
    display: block; background: none; border: none;
    border-bottom: 1px solid #d8cdb4; color: #4a4336;
    font: 0.85rem system-ui, sans-serif; width: 92%; padding: 0.15em 0.2em;
  }
  .replyinput::placeholder { color: #b8ad97; }
  /* floating annotate control over a text selection */
  #annotate {
    position: absolute; z-index: 5; display: none;
    background: var(--paper); border: 1px solid #d8cdb4; border-radius: 8px;
    padding: 0.3em 0.7em; box-shadow: 0 2px 12px rgba(60,50,30,0.15);
    font: 0.85rem system-ui, sans-serif; color: #6b6458;
  }
  #annotate button { background: none; border: none; cursor: pointer;
    color: #6b6458; font: inherit; }
  #annotate input { background: none; border: none; border-bottom: 1px solid #d8cdb4;
    color: #4a4336; font: inherit; width: 260px; padding: 0.1em 0.2em; }
  /* the endnote: a bookmark card pinned at its note's height, joined to the
     note by a ribbon across the gutter — an extension of the margin note
     that lives in the page (it scrolls with the book) */
  :root { --ribbon: #8e3b2f; }
  #en-ribbon {
    position: absolute; background: var(--ribbon); opacity: 0.55;
    z-index: 5; display: none; border-radius: 2px;
    box-shadow: 0 1px 3px rgba(60,50,30,0.25);
  }
  #endnote {
    position: absolute; right: 12px; width: 360px; z-index: 6;
    background: #f4eedd; border: 1px solid #ddd2ba; border-top: 4px solid var(--ribbon);
    border-radius: 3px; box-shadow: 0 4px 20px rgba(60,50,30,0.16);
    display: none; flex-direction: column; padding: 0.9rem 1.1rem 0.8rem;
    max-height: 74vh; transform: rotate(0.3deg);
  }
  #endnote.open { display: flex; animation: unfurl 0.25s ease-out; }
  @keyframes unfurl {
    from { opacity: 0; transform: translateX(-18px) rotate(0.3deg); }
    to   { opacity: 1; transform: rotate(0.3deg); }
  }
  #endnote::before {   /* the bookmark ribbon's tail over the top edge */
    content: ""; position: absolute; top: -18px; left: 24px;
    width: 24px; height: 24px; background: var(--ribbon);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 62%, 0 100%);
  }
  #endnote h3 { font: 600 0.75rem system-ui, sans-serif; color: var(--ribbon);
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.45rem; }
  #endnote .close { position: absolute; top: 0.6rem; right: 0.8rem; cursor: pointer;
    border: none; background: none; color: var(--pencil); font-size: 1rem; }
  #en-root { font: italic 0.85rem Georgia, serif; color: #8a8172;
    border-bottom: 1px solid #e8dfcc; padding-bottom: 0.5rem; margin-bottom: 0.6rem; }
  #en-msgs { flex: 1; overflow-y: auto; min-height: 2rem; }
  #en-msgs .m { margin-bottom: 0.75rem; line-height: 1.25; }
  #en-msgs .m .mwho { display: block; font: 0.6rem system-ui, sans-serif;
    color: #b8ad97; letter-spacing: 0.08em; text-transform: uppercase; }
  #en-msgs .m.marginalia { color: var(--note-ink);
    font-family: var(--note-font, "KaTeX_Main"), Georgia, serif;
    font-style: var(--note-style, italic); font-size: 1.2rem; }
  #en-msgs .m.reader { color: #6b6458;
    font-family: var(--note-font, "KaTeX_Main"), Georgia, serif;
    font-style: var(--note-style, italic); font-size: 1.05rem; }
  #endnote > input { background: none; border: none; border-top: 1px solid #d8cdb4;
    color: #4a4336; font: 0.9rem system-ui, sans-serif; padding: 0.6em 0.2em 0.2em; }
  #endnote > input::placeholder { color: #b8ad97; }
  /* while Marginalia thinks: a hovering pencil at the freshest line */
  #pencil {
    position: absolute; left: 64%; padding-left: 0.9rem;
    font-size: 1.5rem; color: var(--pencil);
    animation: hover 1.6s ease-in-out infinite; display: none;
    transition: top 0.45s ease;
  }
  #pencil.on { display: block; }
  @keyframes hover {
    0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; }
  }

  /* grading (?grade / ?ops): pencil marks under the note */
  .gradebtns { display: block; margin-top: 0.15em;
               font: 0.85rem system-ui, sans-serif; }
  .gradebtns button {
    background: none; border: 1px solid #d8cdb4; color: var(--pencil);
    border-radius: 6px; padding: 0.1em 0.45em; cursor: pointer; margin-right: 0.3em;
  }
  .gradebtns button.picked { border-color: var(--note-ink-soft); }
  .gradebtns button:disabled { cursor: default; }
  .tally { font-size: 0.72rem; color: #7d9a6e; margin-left: 0.2em; }
  .gradenote {
    background: none; border: none; border-bottom: 1px solid #d8cdb4;
    color: #4a4336; font: 0.8rem system-ui, sans-serif;
    padding: 0.15em 0.2em; width: 85%;
  }
  .gradenote::placeholder { color: #b8ad97; }
  .noted { color: #7d9a6e; font: 0.75rem system-ui, sans-serif; }

  #texttoggle {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 3;
    background: none; border: 1px solid #d8cdb4; color: var(--pencil);
    border-radius: 6px; font: 0.72rem system-ui, sans-serif;
    padding: 0.3em 0.7em; cursor: pointer;
  }
  #qr {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 3; text-align: center;
    font: 0.62rem/1.5 system-ui, sans-serif; color: var(--pencil);
  }
  #qr img { width: 84px; height: 84px; background: #fff; padding: 4px;
            border-radius: 4px; display: block; margin: 0 auto 0.2rem;
            border: 1px solid #d8cdb4; }
  #qr[hidden] { display: none; }

  /* phones: single column, notes fall in-flow under their paragraph zone */
  @media (max-width: 760px) {
    #text { width: 88%; margin-left: 6%; }
    .note, #pencil { left: 10%; width: 82%; position: relative; margin: 0.5rem 0; }
    #notes { position: static; }
    .note { top: auto !important; }
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="book">
    <div id="text"></div>
    <div id="notes"></div>
    <div id="pencil">✎</div>
  </div>
  <button id="texttoggle" title="also: press t">¶ text</button>
  <div id="annotate"></div>
  <div id="en-ribbon"></div>
  <div id="endnote">
    <button class="close">✕</button>
    <h3 id="en-title">Endnote</h3>
    <div id="en-root"></div>
    <div id="en-msgs"></div>
    <input id="en-input" placeholder="reply… (Enter to send)">
  </div>
  <div id="qr" hidden><img src="/qr.svg" alt=""><span id="qr-url"></span></div>
<script>
  const params  = new URLSearchParams(location.search);
  const gradeOn = params.has("grade") || params.has("ops");
  const status  = document.getElementById("status");
  const textEl  = document.getElementById("text");
  const notesEl = document.getElementById("notes");
  const bookEl  = document.getElementById("book");
  const pencil  = document.getElementById("pencil");
  let crashed = false;

  function setStatus(text) {
    status.textContent = text;
    crashed = text.includes("crashed");
    status.classList.toggle("crashed", crashed);
    status.classList.toggle("thinking", !crashed && text.startsWith("thinking"));
    status.classList.toggle("live", !crashed && !text.startsWith("thinking"));
  }

  // SSE replay can beat the deferred KaTeX CDN scripts: queue anything that
  // arrives too early and re-render it once KaTeX is in
  const katexPending = new Set();
  function katexify(el) {
    if (typeof renderMathInElement === "undefined") { katexPending.add(el); return; }
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true },
      ],
      throwOnError: false,
    });
  }

  // ---- the body text: transcript as textbook paragraphs, word-addressable ----
  const words = [];        // [{n: normalized, el: span}] over the whole session
  let para = null, paraWho = null, paraWords = 0;
  const norm = (w) => w.toLowerCase().replace(/[^a-z0-9']+/g, "");

  // stable color per anonymous speaker letter (muted for paper)
  function whoColor(w) {
    let h = 0;
    for (const ch of w) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h}, 35%, 42%)`;
  }

  const lineEvents = [];   // {id, text, ts} in render order, for revisions

  function appendTranscript(ev) {
    lineEvents.push(ev);
    renderLine(ev);
  }

  function renderLine(ev) {
    const lid = ev.id ?? -1;
    if (/^\[silence \d+s\]$/.test(ev.text)) {  // long pauses render as a gap mark
      const p = document.createElement("p");
      p.className = "pausemark";
      p.dataset.line = lid;
      p.textContent = "· · ·  " + ev.text.slice(9, -1);
      textEl.append(p);
      para = null;
      layout();
      return;
    }
    const m = ev.text.match(/^([A-Za-z]+\d*(?:-\d+)?): (.*)$/s);
    const who = m ? m[1] : paraWho;
    const prov = !!(who && /[a-z]/.test(who));   // lowercase = provisional
    const body = m ? m[2] : ev.text;
    if (!para || who !== paraWho || paraWords > 90) {
      para = document.createElement("p");
      para.className = "para";
      if (who) {
        const label = document.createElement("span");
        label.className = "label" + (prov ? " prov" : "");
        label.dataset.line = lid;
        label.style.color = whoColor(who.toUpperCase());
        label.textContent = who;
        para.append(label);
      }
      textEl.append(para);
      paraWho = who; paraWords = 0;
    }
    for (const raw of body.split(/\s+/)) {
      if (!raw) continue;
      const span = document.createElement("span");
      span.className = "w" + (prov ? " prov" : "");
      span.dataset.line = lid;
      span.textContent = raw + " ";
      para.append(span);
      words.push({ n: norm(raw), el: span });
      paraWords++;
    }
    layout();
  }

  // find the most recent occurrence of the quoted word sequence; tolerate one
  // ASR-mangled word at either end
  function findAnchor(quote) {
    const seq = quote.split(/\s+/).map(norm).filter(Boolean);
    const tries = [seq, seq.slice(1), seq.slice(0, -1), seq.slice(1, -1)];
    for (const t of tries) {
      if (t.length < 2 && seq.length >= 2) continue;
      if (!t.length) continue;
      for (let i = words.length - t.length; i >= 0; i--) {
        let ok = true;
        for (let j = 0; j < t.length; j++)
          if (words[i + j].n !== t[j]) { ok = false; break; }
        if (ok) return words.slice(i, i + t.length).map(w => w.el);
      }
    }
    return null;
  }

  // ---- margin notes ----
  const noteRegistry = [];   // stacking order = creation order
  let liveNote = null;       // the note currently being written

  function splitComment(text) {
    const lines = text.split("\n");
    const quote = lines.filter(l => l.startsWith("> ")).map(l => l.slice(2)).join(" ");
    const body  = lines.filter(l => !l.startsWith("> ")).join(" ").trim();
    return { quote, body };
  }

  function anchorY(els) {
    if (!els || !els.length) {
      const last = words[words.length - 1];
      return last ? last.el.offsetTop : 0;
    }
    return els[0].offsetTop;
  }

  function makeNote(id, cls) {
    const el = document.createElement("div");
    el.className = "note" + (cls ? " " + cls : "");
    const body = document.createElement("span");
    el.append(body);
    notesEl.append(el);
    const note = { id, el, bodyEl: body, anchorEls: null, y: 0, rendered: 0 };
    el.addEventListener("mouseenter", () =>
      (note.anchorEls || []).forEach(a => a.classList.add("hot")));
    el.addEventListener("mouseleave", () =>
      (note.anchorEls || []).forEach(a => a.classList.remove("hot")));
    noteRegistry.push(note);
    return note;
  }

  function anchorNote(note, quote) {
    note.quote = quote;   // kept for re-anchoring after a revision
    note.anchorEls = findAnchor(quote);
    if (note.anchorEls) note.anchorEls.forEach(a => a.classList.add("anch"));
    else if (quote && !note.el.querySelector(".lead")) {
      // quote didn't match the transcript (ASR drift): show it in the margin
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = "“" + quote + "”";
      note.el.prepend(lead);
    }
    note.y = anchorY(note.anchorEls);
  }

  // split the body into word tokens, keeping $...$ math runs whole so KaTeX
  // sees intact delimiters; an unclosed run is withheld until its closing $
  function tokenize(body, final) {
    const out = [];
    let buf = null;
    for (const p of body.split(/\s+/).filter(Boolean)) {
      const odd = ((p.match(/\$/g) || []).length) % 2 === 1;
      if (buf === null) {
        if (odd) buf = p; else out.push(p);
      } else {
        buf += " " + p;
        if (odd) { out.push(buf); buf = null; }
      }
    }
    if (final && buf !== null) out.push(buf);
    return out;
  }

  // append body words with the ink-wipe reveal; animate=false for replays
  function writeWords(note, body, animate, holdLast) {
    const parts = tokenize(body, !holdLast);
    const upto = holdLast ? parts.length - 1 : parts.length;  // last word may be mid-stream
    for (; note.rendered < upto; note.rendered++) {
      const w = document.createElement("span");
      w.className = "w " + (animate ? "ink" : "now");
      w.textContent = parts[note.rendered];
      note.bodyEl.append(w);
      if (parts[note.rendered].includes("$")) katexify(w);
    }
  }

  function finishNote(note, comment) {
    note.bodyEl.querySelector(".pen")?.remove();
    writeWords(note, splitComment(comment.text).body, true, false);
    katexify(note.bodyEl);
    if (gradeOn && comment.id != null) note.el.append(gradeButtons(comment.id, comment));
    if (comment.id != null) registerNote(note, "note", comment.id);
    layout();
  }

  // ---- stacking: notes sit at their anchor, pushed down past earlier notes ----
  function layout() {
    // pass 1: how far a note is pushed below its anchor decides its size —
    // a crowded margin writes smaller, like a real annotator running out of
    // room (this is what keeps dense commentary from outrunning the text)
    let y = 0;
    for (const n of noteRegistry) {
      if (!n.el.classList.contains("scribble")) {
        const over = Math.max(0, y - n.y);
        const reader = n.el.classList.contains("reader") ? 0.82 : 1;
        const s = Math.max(0.68, 1 - over / 1600) * reader;
        n.el.style.fontSize =
          `calc(clamp(22px, 2.0vw, 32px) * var(--note-scale, 1) * ${s.toFixed(3)})`;
      }
      y = Math.max(n.y, y) + n.el.offsetHeight + 14;
    }
    // pass 2: restack with the post-shrink heights
    y = 0;
    for (const n of noteRegistry) {
      const top = Math.max(n.y, y);
      n.el.style.top = top + "px";
      y = top + n.el.offsetHeight + 14;
    }
    pencil.style.top = Math.max(anchorY(null), y) + "px";
    bookEl.style.minHeight = Math.max(textEl.offsetHeight, y) + 300 + "px";
    positionEndnote();   // card and bookmarks follow their notes on restacks
    positionBookmarks();
    if (pinned) window.scrollTo({ top: document.body.scrollHeight });
  }
  // webfonts (and font cycling) change note heights after they were measured
  document.fonts.addEventListener("loadingdone", () => layout());
  document.fonts.ready.then(() => layout());
  let pinned = true;
  window.addEventListener("scroll", () => {
    pinned = window.innerHeight + window.scrollY > document.body.scrollHeight - 160;
  });
  window.addEventListener("resize", () => {
    for (const n of noteRegistry) n.y = anchorY(n.anchorEls);
    layout();
  });

  function gradeButtons(id, counts) {
    const span = document.createElement("span");
    span.className = "gradebtns";
    [["👍", "up"], ["👎", "down"]].forEach(([face, grade]) => {
      const b = document.createElement("button");
      b.textContent = face;
      const n = document.createElement("span");
      n.className = "tally"; n.dataset.id = id; n.dataset.g = grade;
      n.textContent = counts && counts[grade] ? counts[grade] : "";
      b.append(n);
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        fetch("/grade", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, grade }) });
        span.querySelectorAll("button").forEach(x => { x.disabled = true; });
        b.classList.add("picked");
        const input = document.createElement("input");
        input.className = "gradenote";
        input.placeholder = "why? (only Marginalia sees this)";
        input.maxLength = 300;
        input.addEventListener("keydown", (k) => {
          if (k.key !== "Enter" || !input.value.trim()) return;
          fetch("/grade_note", { method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, grade, note: input.value.trim() }) });
          const ok = document.createElement("span");
          ok.className = "noted"; ok.textContent = "noted ✓";
          input.replaceWith(ok);
        });
        span.append(input);
        input.focus();
        layout();
      });
      span.append(b);
    });
    return span;
  }

  // ---- reader marginalia, endnote threads ----
  const noteByKey = {};   // "note:3" / "margin:0" -> note object
  const threadsC = {};    // tid -> {root_kind, root_id, msgs: []}
  let openTid = null;
  const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  const sup = (n) => String(n).split("").map(d => SUP[+d]).join("");

  function registerNote(note, kind, id) {
    note.rootKind = kind; note.rootId = id;
    noteByKey[kind + ":" + id] = note;
    const b = document.createElement("button");
    b.className = "replybtn"; b.textContent = "↩"; b.title = "reply (opens an endnote)";
    b.addEventListener("click", () => {
      if (note.el.querySelector(".replyinput")) return;
      const input = document.createElement("input");
      input.className = "replyinput";
      input.placeholder = "reply… (Enter to send)";
      input.addEventListener("keydown", (k) => {
        if (k.key === "Escape") { input.remove(); return; }
        if (k.key !== "Enter" || !input.value.trim()) return;
        fetch("/reply", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ root_kind: kind, root_id: id,
                                 text: input.value.trim() }) })
          .then(r => r.json()).then(r => { if (r.tid) openEndnote(r.tid); });
        input.remove();
        layout();
      });
      note.el.append(input);
      input.focus();
      layout();
    });
    note.el.append(b);
  }

  const bookmarks = {};   // tid -> ribbon element at the page's right edge

  function createBookmark(tid) {
    if (bookmarks[tid]) return;
    const b = document.createElement("div");
    b.className = "bookmark";
    const label = document.createElement("span");
    label.textContent = "Endnote " + sup(tid);
    const count = document.createElement("span");
    count.className = "bcount";
    count.textContent = (threadsC[tid]?.msgs || []).length || "";
    b.append(label, count);
    b.addEventListener("click", () =>
      openTid === tid ? closeEndnote() : openEndnote(tid));
    document.body.append(b);
    bookmarks[tid] = b;
    positionBookmarks();
  }

  // bookmarks sit at their note's height, pushed down past one another
  function positionBookmarks() {
    const items = Object.keys(bookmarks).map(Number).map(tid => {
      const t = threadsC[tid];
      const root = t && noteByKey[t.root_kind + ":" + t.root_id];
      return { tid, top: root
        ? root.el.getBoundingClientRect().top + window.scrollY : 80 };
    }).sort((a, b) => a.top - b.top);
    let yy = 0;
    for (const it of items) {
      const el = bookmarks[it.tid];
      const top = Math.max(it.top, yy);
      el.style.top = top + "px";
      el.classList.toggle("active", openTid === it.tid);
      yy = top + el.offsetHeight + 6;
    }
  }

  function closeEndnote() {
    document.getElementById("endnote").classList.remove("open");
    document.getElementById("en-ribbon").style.display = "none";
    openTid = null;
    positionBookmarks();
  }

  function openEndnote(tid) {
    if (!threadsC[tid]) threadsC[tid] = { root_kind: null, root_id: null, msgs: [] };
    openTid = tid;
    const t = threadsC[tid];
    document.getElementById("en-title").textContent = "Endnote " + sup(tid);
    const root = noteByKey[t.root_kind + ":" + t.root_id];
    document.getElementById("en-root").textContent = !root ? "" :
      [...root.bodyEl.querySelectorAll(".w")].map(w => w.textContent).join(" ")
        .slice(0, 160);
    renderEndnoteMsgs();
    document.getElementById("endnote").classList.add("open");
    positionEndnote();
    positionBookmarks();
    document.getElementById("en-input").focus();
  }

  // pin the card at its note's height and lay the ribbon across the gutter,
  // so the thread reads as an extension of the note it grew from
  function positionEndnote() {
    if (openTid === null) return;
    const t = threadsC[openTid];
    const root = noteByKey[t.root_kind + ":" + t.root_id];
    const panel = document.getElementById("endnote");
    const ribbon = document.getElementById("en-ribbon");
    if (!root) {
      panel.style.top = (window.scrollY + 80) + "px";
      ribbon.style.display = "none";
      return;
    }
    // hang the card just below its note, offset right; the ribbon runs
    // straight up from the card's tail into the note it grew from
    const r = root.el.getBoundingClientRect();
    const top = r.bottom + window.scrollY + 10;
    panel.style.top = top + "px";
    const pr = panel.getBoundingClientRect();
    ribbon.style.display = "block";
    ribbon.style.left = (pr.left + window.scrollX + 30) + "px";
    ribbon.style.top = (r.top + window.scrollY + 8) + "px";
    ribbon.style.width = "7px";
    ribbon.style.height = Math.max(0, top - (r.top + window.scrollY) - 6) + "px";
  }

  function renderEndnoteMsgs() {
    const box = document.getElementById("en-msgs");
    box.innerHTML = "";
    for (const m of (threadsC[openTid]?.msgs || [])) {
      const d = document.createElement("div");
      d.className = "m " + m.who;
      const w = document.createElement("span");
      w.className = "mwho"; w.textContent = m.who + " · " + m.ts;
      d.append(w, document.createTextNode(m.text));
      katexify(d);
      box.append(d);
    }
    box.scrollTop = box.scrollHeight;
  }

  document.querySelector("#endnote .close").addEventListener("click", closeEndnote);
  document.getElementById("en-input").addEventListener("keydown", (k) => {
    const input = k.target;
    if (k.key !== "Enter" || !input.value.trim() || openTid === null) return;
    const t = threadsC[openTid];
    fetch("/reply", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ root_kind: t.root_kind, root_id: t.root_id,
                             text: input.value.trim() }) });
    input.value = "";
  });

  // ---- highlight body text -> write your own margin note ----
  const annotate = document.getElementById("annotate");
  document.addEventListener("mouseup", (e) => {
    if (annotate.contains(e.target)) return;
    const sel = window.getSelection();
    const txt = sel.isCollapsed ? "" : sel.toString().trim();
    if (!txt || !textEl.contains(sel.anchorNode)) { annotate.style.display = "none"; return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    annotate.innerHTML = "";
    const b = document.createElement("button");
    b.textContent = "✎ margin note";
    const quote = txt.slice(0, 280);
    b.addEventListener("click", () => {
      annotate.innerHTML = "";
      const input = document.createElement("input");
      input.placeholder = "your note… (Enter)";
      input.addEventListener("keydown", (k) => {
        if (k.key === "Escape") { annotate.style.display = "none"; return; }
        if (k.key !== "Enter" || !input.value.trim()) return;
        fetch("/margin", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quote, text: input.value.trim() }) });
        annotate.style.display = "none";
      });
      annotate.append(input);
      input.focus();
    });
    annotate.append(b);
    annotate.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 320) + "px";
    annotate.style.top = (rect.bottom + window.scrollY + 6) + "px";
    annotate.style.display = "block";
  });

  // ---- events ----
  const es = new EventSource("/events");
  es.onopen  = () => setStatus("live");
  es.onerror = () => { if (!crashed) setStatus("reconnecting…"); };

  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "transcript") {
      appendTranscript(ev);
    } else if (ev.type === "revision") {
      // the batch lane rewrote the provisional tail: re-render everything
      // from the first replaced line, keeping newer still-provisional lines
      const removed = new Set(ev.replaced_ids);
      let idx = lineEvents.findIndex(l => removed.has(l.id));
      if (idx === -1) idx = lineEvents.length;
      const retained = lineEvents.slice(idx).filter(l => !removed.has(l.id));
      const toRemove = new Set(lineEvents.slice(idx).map(l => l.id));
      lineEvents.length = idx;
      textEl.querySelectorAll("[data-line]").forEach(el => {
        if (toRemove.has(+el.dataset.line)) el.remove();
      });
      textEl.querySelectorAll("p").forEach(p => {
        if (!p.querySelector(".w") && !p.classList.contains("pausemark")) p.remove();
      });
      while (words.length && !words[words.length - 1].el.isConnected) words.pop();
      para = null; paraWho = null; paraWords = 0;
      for (const l of ev.lines) appendTranscript(l);
      for (const l of retained) appendTranscript(l);
      for (const n of noteRegistry) {   // re-anchor notes into the new text
        if (n.anchorEls && n.anchorEls.some(a => !a.isConnected)) {
          n.anchorEls = null;
          anchorNote(n, n.quote || "");
        }
      }
      layout();
    } else if (ev.type === "comment") {              // replay for late joiners
      const note = makeNote(ev.id, ev.kind === "ask" ? "ask" : "");
      const { quote, body } = splitComment(ev.text);
      anchorNote(note, quote);
      writeWords(note, body, false, false);
      katexify(note.bodyEl);
      if (gradeOn) note.el.append(gradeButtons(ev.id, ev));
      registerNote(note, "note", ev.id);
      layout();
    } else if (ev.type === "user_margin") {          // a reader wrote on the page
      const note = makeNote(null, "reader");
      anchorNote(note, ev.quote);
      writeWords(note, ev.text, true, false);
      registerNote(note, "margin", ev.id);
      layout();
    } else if (ev.type === "thread") {
      threadsC[ev.tid] = threadsC[ev.tid] ||
        { root_kind: ev.root_kind, root_id: ev.root_id, msgs: [] };
      threadsC[ev.tid].root_kind = ev.root_kind;
      threadsC[ev.tid].root_id = ev.root_id;
      createBookmark(ev.tid);
    } else if (ev.type === "thread_msg") {
      if (!threadsC[ev.tid]) threadsC[ev.tid] = { root_kind: null, root_id: null, msgs: [] };
      threadsC[ev.tid].msgs.push(ev);
      const bc = bookmarks[ev.tid]?.querySelector(".bcount");
      if (bc) bc.textContent = threadsC[ev.tid].msgs.length;
      if (openTid === ev.tid) renderEndnoteMsgs();
    } else if (ev.type === "comment_start") {
      pencil.classList.remove("on");
      liveNote = makeNote(ev.id);
      liveNote.pen = document.createElement("span");
      liveNote.pen.className = "w now pen"; liveNote.pen.textContent = "✎";
    } else if (ev.type === "comment_delta" && liveNote) {
      const { quote, body } = splitComment(ev.text);
      if (!liveNote.anchorEls && !liveNote.anchoredOnce && body) {
        anchorNote(liveNote, quote);
        liveNote.anchoredOnce = true;
      }
      if (body) {
        liveNote.pen.remove();
        writeWords(liveNote, body, true, true);
        liveNote.bodyEl.append(liveNote.pen);
        layout();
      }
    } else if (ev.type === "comment_done") {
      const note = (liveNote && liveNote.id === ev.id) ? liveNote
                   : makeNote(ev.id, ev.kind === "ask" ? "ask" : "");
      if (!note.anchoredOnce && !note.anchorEls)
        anchorNote(note, splitComment(ev.text).quote);
      finishNote(note, ev);
      liveNote = null;
    } else if (ev.type === "stage") {
      if (!crashed) setStatus(ev.text === "listening" ? "live" : ev.text);
      if (ev.text === "thinking…") { pencil.classList.add("on"); layout(); }
    } else if (ev.type === "pass") {
      pencil.classList.remove("on");
    } else if (ev.type === "search_spawn") {
      pencil.classList.remove("on");
      const note = makeNote(null, "scribble");
      note.y = anchorY(null);
      note.bodyEl.textContent = "🔎 looking up: " + ev.text;
      layout();
    } else if (ev.type === "status") {
      setStatus(ev.text);
    } else if (ev.type === "grade") {
      document.querySelectorAll(`.tally[data-id="${ev.id}"]`).forEach(t => {
        const n = ev[t.dataset.g];
        t.textContent = n ? n : "";
      });
    }
  };

  window.addEventListener("load", () => {
    const pending = [...katexPending]; katexPending.clear();
    pending.forEach(el => katexify(el));
    if (pending.length) layout();
  });

  // ---- handwriting font: press f to cycle, ?font=Name or localStorage to pin ----
  // 3b1b's actual font is CMU Serif italic (Computer Modern), which KaTeX's
  // own fonts already provide — no extra download
  const FONTS = [
    { name: "CMU Serif italic (3b1b)", family: "KaTeX_Main", scale: 0.86, weight: 400, style: "italic" },
    { name: "Caveat", family: "Caveat", scale: 1.0, weight: 600, style: "normal" },
    { name: "Kalam", family: "Kalam", scale: 0.80, weight: 400, style: "normal" },
    { name: "Shadows Into Light", family: "Shadows Into Light", scale: 0.95, weight: 400, style: "normal" },
    { name: "Patrick Hand", family: "Patrick Hand", scale: 0.85, weight: 400, style: "normal" },
    { name: "Nanum Pen Script", family: "Nanum Pen Script", scale: 1.05, weight: 400, style: "normal" },
    { name: "Homemade Apple", family: "Homemade Apple", scale: 0.72, weight: 400, style: "normal" },
  ];
  let fontIdx = Math.max(0, FONTS.findIndex(f =>
    f.name.toLowerCase() === (params.get("font") || localStorage.getItem("margin-font2") || "").toLowerCase()));
  function applyFont(announce) {
    const f = FONTS[fontIdx];
    document.documentElement.style.setProperty("--note-font", `"${f.family}"`);
    document.documentElement.style.setProperty("--note-scale", f.scale);
    document.documentElement.style.setProperty("--note-weight", f.weight);
    document.documentElement.style.setProperty("--note-style", f.style);
    localStorage.setItem("margin-font2", f.name);
    if (announce) {
      let toast = document.getElementById("fonttoast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "fonttoast";
        toast.style = "position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);" +
          "background:rgba(74,67,54,0.9);color:#f6f1e4;border-radius:8px;" +
          "padding:0.4em 1em;font:0.85rem system-ui,sans-serif;z-index:4";
        document.body.append(toast);
      }
      toast.textContent = f.name + "  (f to cycle)";
      toast.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.style.display = "none"; }, 1800);
    }
    layout();
  }
  applyFont(false);

  // ---- the transcript is scaffolding: fade it to a ghost with t (or button) ----
  const toggleText = () => document.body.classList.toggle("ghost");
  document.getElementById("texttoggle").addEventListener("click", toggleText);
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input")) return;
    if (e.key === "t") toggleText();
    if (e.key === "f") { fontIdx = (fontIdx + 1) % FONTS.length; applyFont(true); }
  });

  fetch("/meta").then(r => r.json()).then(meta => {
    if (meta.url && !params.has("noqr")) {
      document.getElementById("qr-url").textContent = meta.url.replace("http://", "");
      document.getElementById("qr").hidden = false;
    }
  });
</script>
</body>
</html>
